<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RSS_Todo 正在启动</title>
<style>
  html, body { height: 100%; margin: 0; background: #12151b; color: #e8eaf0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  .logo { width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #ff6b9d, #7c4dff);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff; margin-bottom: 22px; }
  .spin { width: 26px; height: 26px; border: 3px solid #2a2f3a; border-top-color: #ff6b9d;
    border-radius: 50%; animation: rot 0.9s linear infinite; margin-bottom: 14px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .txt { font-size: 14px; color: #9aa3b2; }
</style>
</head>
<body>
  <div class="logo">R</div>
  <div class="spin"></div>
  <div class="txt">RSS_Todo 正在启动后端服务…</div>
</body>
</html>
