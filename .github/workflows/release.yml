name: Build & Release exe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号（commit message 含 vX.Y.Z 才发版）
        id: ver
        uses: actions/github-script@v7
        with:
          script: |
            const m = /v(\d+\.\d+\.\d+)/.exec(context.payload.head_commit?.message || "");
            core.setOutput("has_version", m ? "true" : "false");
            if (m) core.setOutput("version", m[1]);

      - name: 安装 Python
        if: steps.ver.outputs.has_version == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        if: steps.ver.outputs.has_version == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包单文件 exe（playwright 走系统 Edge channel，不下载 chromium）
        if: steps.ver.outputs.has_version == 'true'
        run: python build_exe.py

      - name: 冒烟测试 exe（启动服务并请求首页）
        if: steps.ver.outputs.has_version == 'true'
        shell: bash
        run: |
          ./dist/RSS_Todo.exe --no-browser --port 18848 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18848/ && break || sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18848/)
          echo "首页 HTTP: $code"
          test "$code" = "200"
          curl -s http://127.0.0.1:18848/api/health || true

      - name: 上传 artifact（供下载调试）
        if: steps.ver.outputs.has_version == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RSS_Todo-${{ steps.ver.outputs.version }}.exe
          path: dist/RSS_Todo.exe

      - name: 发布 Release（只放改名后的单文件 exe）
        if: steps.ver.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RSS_Todo v${{ steps.ver.outputs.version }}
          files: dist/RSS_Todo.exe
          fail_on_unmatched_files: true
